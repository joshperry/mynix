# kago: config for TOS's GRUBs (disks' sdX1 and the internal USB flash), handing over
# to the NixOS-managed GRUB config on md9 (/boot). See machines/kago/readme.md.
# Written by boot.loader.grub.extraInstallCommands; originals kept as grub.cfg.tos
# (and the whole flash as @kago-migration/usbflash.img on the data volume).

set timeout=3
set default=nixos

menuentry "NixOS (md9 /boot)" --id nixos {
	insmod mdraid1x
	insmod ext2
	if [ -e (md/UTOSCORE-X86-S64)/grub/grub.cfg ]; then
		configfile (md/UTOSCORE-X86-S64)/grub/grub.cfg
	else
		echo "kago: no grub.cfg on md9 (md/UTOSCORE-X86-S64)"
	fi
}

# TOS's original fallback branch: boot the flash's own kernel (TOS INIT /
# reinstall system). Manual only.
menuentry "TOS INIT system (reinstall)" --id tosinit {
	set root=(hd0,gpt1)
	linux /boot/bzImage type=usb
}
